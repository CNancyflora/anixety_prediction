name: Complete CI/CD & E2E Testing Pipeline

on:
  push:
    branches:
      - main
      - mobile-app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vulnerability:
    name: Vulnerability Tests — Security (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Vulnerability Tests" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Vulnerability_Tests
          path: Test_Results/Excel/*.csv

  appium:
    name: Appium — Android Tests (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Appium" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Appium_Tests
          path: Test_Results/Excel/*.csv

  unit:
    name: Unit Tests — API (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Unit Tests" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Unit_Tests
          path: Test_Results/Excel/*.csv

  validation:
    name: Validation Tests (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Validation Tests" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Validation_Tests
          path: Test_Results/Excel/*.csv

  deployment:
    name: Deployment Status (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Deployment Status" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Deployment_Tests
          path: Test_Results/Excel/*.csv

  load:
    name: Load Testing — Performance (350)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python automation/run_tests.py --category "Load Testing" --count 350
      - uses: actions/upload-artifact@v4
        with:
          name: Load_Tests
          path: Test_Results/Excel/*.csv

  compile:
    name: Compile Master Report & Deploy
    needs: [vulnerability, appium, unit, validation, deployment, load]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: Master_Report
      
      - name: 🚀 Publish Execution Summary
        run: |
          echo "# Enterprise Master Test Report" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Status:** SUCCESS ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Total Parallel Test Cases:** 2,100" >> $GITHUB_STEP_SUMMARY
          echo "All reports have been generated and combined." >> $GITHUB_STEP_SUMMARY
